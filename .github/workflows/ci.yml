name: ASMA-OS CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/storefront/package-lock.json
            apps/founder-screen/package-lock.json
      - name: Build storefront
        working-directory: apps/storefront
        run: npm ci && npm run build
      - name: Build founder console
        working-directory: apps/founder-screen
        run: npm ci && npm run build
